[project]
name = "produce"
version = "0.1.0"
description = "AI-продюсер YouTube-канала: залётные видео, стратегия, план и брифы"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0",
  "google-api-python-client>=2.100",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.10",
  "pytest>=9.1.1",
  "pytest-recording>=0.13",
  "playwright>=1.64",
  "ruff>=0.6",
]

[project.scripts]
produce = "produce.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Сети в тестах нет: настоящий YouTube не вызывается, записанные ответы читаются с диска.
addopts = "--block-network"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
