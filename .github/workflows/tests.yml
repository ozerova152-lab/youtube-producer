name: Tests




on:
  push:
    branches: [main]
  pull_request:
    branches: [main]




permissions:
  contents: read




jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: mkdir -p "$HOME/.local/bin" && curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C "$HOME/.local/bin" gitleaks
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: gitleaks version
      - run: python -m pytest -q



