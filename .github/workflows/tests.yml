name: Tests


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


permissions:
  contents: read


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh | sh -s -- -b "$HOME/.local/bin"
      - run: find "$HOME/.local/bin" -maxdepth 2 -type f -name "gitleaks*" -print && command -v gitleaks || true
      - run: echo "$HOME/.local/bin" >> $GITHUB_PATH
      - run: gitleaks version
      - run: python -m pytest -q

